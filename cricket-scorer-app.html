<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track cricket scores, player stats, and match details with our Gully Cricket Score Tracker. Perfect for street cricket matches.">
    <meta property="og:title" content="StreetCrick Scoreboard - Gully Cricket Score Tracker">
    <meta property="og:description" content="The ultimate cricket scoring app for street cricket enthusiasts. Track scores, player stats, and match summaries.">
    <meta property="og:type" content="website">
    <title>StreetCrick Scoreboard | Gully Cricket Score Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <script src="App.js></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-green-700 text-white shadow-lg">
        <div class="container mx-auto p-4 flex justify-between items-center">
            <div class="flex items-center">
                <i class="fas fa-cricket text-3xl mr-2"></i>
                <h1 class="text-2xl font-bold">StreetCrick</h1>
            </div>
            <nav class="hidden md:flex space-x-6">
                <a href="index.html" class="hover:text-green-200 font-medium">Home</a>
                <a href="score-tracker.html" class="hover:text-green-200 font-medium underline">Score Tracker</a>
                <a href="stats.html" class="hover:text-green-200 font-medium">Stats</a>
                <a href="blog.html" class="hover:text-green-200 font-medium">Blog</a>
                <a href="about.html" class="hover:text-green-200 font-medium">About</a>
            </nav>
            <button class="md:hidden focus:outline-none" id="menu-toggle">
                <i class="fas fa-bars text-2xl"></i>
            </button>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-green-800 p-4">
            <nav class="flex flex-col space-y-3">
                <a href="index.html" class="text-white hover:text-green-200">Home</a>
                <a href="score-tracker.html" class="text-white hover:text-green-200 font-bold">Score Tracker</a>
                <a href="stats.html" class="text-white hover:text-green-200">Stats</a>
                <a href="blog.html" class="text-white hover:text-green-200">Blog</a>
                <a href="about.html" class="text-white hover:text-green-200">About</a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <!-- Match Setup Section -->
        <section id="match-setup" class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Create New Match</h2>
            <form id="new-match-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-700 mb-2" for="team1">Team 1 Name</label>
                        <input type="text" id="team1" class="w-full border border-gray-300 rounded-md px-3 py-2" placeholder="Team 1" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2" for="team2">Team 2 Name</label>
                        <input type="text" id="team2" class="w-full border border-gray-300 rounded-md px-3 py-2" placeholder="Team 2" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-gray-700 mb-2" for="overs">Total Overs</label>
                        <input type="number" id="overs" class="w-full border border-gray-300 rounded-md px-3 py-2" min="1" max="50" value="10" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2" for="players-per-team">Players per Team</label>
                        <input type="number" id="players-per-team" class="w-full border border-gray-300 rounded-md px-3 py-2" min="3" max="11" value="6" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2" for="match-location">Location</label>
                        <input type="text" id="match-location" class="w-full border border-gray-300 rounded-md px-3 py-2" placeholder="Street Name/Locality" required>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition w-full md:w-auto">Start Match</button>
                </div>
            </form>
        </section>

        <!-- Player Registration Section -->
        <section id="player-registration" class="bg-white rounded-lg shadow-md p-6 mb-6 hidden">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Add Players</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div id="team1-players">
                    <h3 class="text-lg font-bold mb-3 text-green-700" id="team1-name-display">Team 1</h3>
                    <div id="team1-player-inputs" class="space-y-3">
                        <!-- Player inputs for Team 1 will be generated here -->
                    </div>
                </div>
                <div id="team2-players">
                    <h3 class="text-lg font-bold mb-3 text-green-700" id="team2-name-display">Team 2</h3>
                    <div id="team2-player-inputs" class="space-y-3">
                        <!-- Player inputs for Team 2 will be generated here -->
                    </div>
                </div>
            </div>
            <div class="mt-6">
                <button id="start-scoring" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition w-full md:w-auto">Start Scoring</button>
            </div>
        </section>

        <!-- Match Scoring Section -->
        <section id="match-scoring" class="hidden">
            <!-- Match Info Banner -->
            <div class="bg-green-700 text-white rounded-t-lg p-4 flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold" id="match-teams-display">Team A vs Team B</h2>
                    <p class="text-sm" id="match-info-display">10 overs match at Street Ground</p>
                </div>
                <div class="text-right">
                    <p class="text-lg font-semibold" id="current-innings-display">1st Innings</p>
                    <p class="text-sm" id="batting-team-display">Team A batting</p>
                </div>
            </div>

            <!-- Scoreboard -->
            <div class="bg-white rounded-b-lg shadow-md p-6 mb-6">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Main Score -->
                    <div class="lg:col-span-2">
                        <div class="bg-gray-100 p-4 rounded-lg mb-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <h3 class="text-gray-600 text-sm">Score</h3>
                                    <p class="text-3xl font-bold text-gray-800" id="score-display">0/0</p>
                                </div>
                                <div>
                                    <h3 class="text-gray-600 text-sm">Overs</h3>
                                    <p class="text-3xl font-bold text-gray-800" id="overs-display">0.0</p>
                                </div>
                                <div>
                                    <h3 class="text-gray-600 text-sm">Run Rate</h3>
                                    <p class="text-xl font-bold text-gray-800" id="run-rate-display">0.00</p>
                                </div>
                                <div id="target-container" class="hidden">
                                    <h3 class="text-gray-600 text-sm">Target</h3>
                                    <p class="text-xl font-bold text-green-600" id="target-display">0</p>
                                </div>
                            </div>
                        </div>

                        <!-- Current Batsmen -->
                        <div class="bg-gray-100 p-4 rounded-lg mb-4">
                            <h3 class="text-lg font-semibold mb-2">Current Batsmen</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="bg-white p-3 rounded shadow-sm">
                                    <div class="flex justify-between">
                                        <p class="font-medium" id="striker-name">Striker</p>
                                        <p class="font-bold text-green-600" id="striker-score">0(0)</p>
                                    </div>
                                    <div class="mt-1 h-1 bg-green-200 rounded">
                                        <div class="h-1 bg-green-600 rounded" id="striker-sr-indicator" style="width: 0%"></div>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-1">SR: <span id="striker-sr">0.00</span></p>
                                </div>
                                <div class="bg-white p-3 rounded shadow-sm">
                                    <div class="flex justify-between">
                                        <p class="font-medium" id="non-striker-name">Non-striker</p>
                                        <p class="font-bold" id="non-striker-score">0(0)</p>
                                    </div>
                                    <div class="mt-1 h-1 bg-green-200 rounded">
                                        <div class="h-1 bg-green-600 rounded" id="non-striker-sr-indicator" style="width: 0%"></div>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-1">SR: <span id="non-striker-sr">0.00</span></p>
                                </div>
                            </div>
                        </div>

                        <!-- Current Bowler -->
                        <div class="bg-gray-100 p-4 rounded-lg mb-4">
                            <h3 class="text-lg font-semibold mb-2">Current Bowler</h3>
                            <div class="bg-white p-3 rounded shadow-sm">
                                <div class="flex justify-between">
                                    <p class="font-medium" id="bowler-name">Bowler</p>
                                    <p class="font-bold text-blue-600" id="bowler-figures">0-0 (0.0)</p>
                                </div>
                                <div class="mt-1 h-1 bg-blue-200 rounded">
                                    <div class="h-1 bg-blue-600 rounded" id="bowler-economy-indicator" style="width: 0%"></div>
                                </div>
                                <p class="text-xs text-gray-500 mt-1">Economy: <span id="bowler-economy">0.00</span></p>
                            </div>
                        </div>

                        <!-- This Over -->
                        <div class="bg-gray-100 p-4 rounded-lg mb-4">
                            <h3 class="text-lg font-semibold mb-2">This Over</h3>
                            <div class="bg-white p-3 rounded shadow-sm flex flex-wrap gap-2" id="this-over-balls">
                                <!-- Balls will be displayed here -->
                                <span class="text-gray-400">No balls bowled yet</span>
                            </div>
                        </div>
                    </div>

                    <!-- Scoring Controls -->
                    <div class="bg-gray-100 p-4 rounded-lg">
                        <h3 class="text-lg font-semibold mb-3">Scoring</h3>
                        
                        <!-- Runs Buttons -->
                        <div class="grid grid-cols-4 gap-2 mb-4">
                            <button class="run-btn bg-white hover:bg-gray-50 text-gray-800 font-bold py-3 px-4 rounded shadow" data-runs="0">0</button>
                            <button class="run-btn bg-white hover:bg-gray-50 text-gray-800 font-bold py-3 px-4 rounded shadow" data-runs="1">1</button>
                            <button class="run-btn bg-white hover:bg-gray-50 text-gray-800 font-bold py-3 px-4 rounded shadow" data-runs="2">2</button>
                            <button class="run-btn bg-white hover:bg-gray-50 text-gray-800 font-bold py-3 px-4 rounded shadow" data-runs="3">3</button>
                            <button class="run-btn bg-white hover:bg-gray-50 text-blue-700 font-bold py-3 px-4 rounded shadow" data-runs="4">4</button>
                            <button class="run-btn bg-white hover:bg-gray-50 text-gray-800 font-bold py-3 px-4 rounded shadow" data-runs="5">5</button>
                            <button class="run-btn bg-white hover:bg-gray-50 text-blue-700 font-bold py-3 px-4 rounded shadow" data-runs="6">6</button>
                            <button class="run-btn bg-white hover:bg-gray-50 text-gray-800 font-bold py-3 px-4 rounded shadow" data-runs="7">7</button>
                        </div>

                        <!-- Extras Buttons -->
                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <button id="wide-btn" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-medium py-2 px-4 rounded shadow">Wide</button>
                            <button id="no-ball-btn" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-medium py-2 px-4 rounded shadow">No Ball</button>
                            <button id="bye-btn" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-medium py-2 px-4 rounded shadow">Bye</button>
                            <button id="leg-bye-btn" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-medium py-2 px-4 rounded shadow">Leg Bye</button>
                        </div>

                        <!-- Wicket Button -->
                        <button id="wicket-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded shadow w-full mb-4">Wicket</button>

                        <!-- Other Controls -->
                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <button id="undo-btn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-2 px-4 rounded shadow">Undo</button>
                            <button id="end-over-btn" class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded shadow" disabled>End Over</button>
                        </div>

                        <button id="end-innings-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow w-full">End Innings</button>
                    </div>
                </div>

                <!-- Batsmen and Bowlers List -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                    <div>
                        <h3 class="text-lg font-semibold mb-2">Batting</h3>
                        <div class="overflow-x-auto">
                            <table class="min-w-full bg-white">
                                <thead>
                                    <tr class="bg-gray-100 text-gray-700">
                                        <th class="py-2 px-3 text-left">Batsman</th>
                                        <th class="py-2 px-3 text-right">R</th>
                                        <th class="py-2 px-3 text-right">B</th>
                                        <th class="py-2 px-3 text-right">4s</th>
                                        <th class="py-2 px-3 text-right">6s</th>
                                        <th class="py-2 px-3 text-right">SR</th>
                                    </tr>
                                </thead>
                                <tbody id="batting-stats">
                                    <!-- Batting stats will go here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-lg font-semibold mb-2">Bowling</h3>
                        <div class="overflow-x-auto">
                            <table class="min-w-full bg-white">
                                <thead>
                                    <tr class="bg-gray-100 text-gray-700">
                                        <th class="py-2 px-3 text-left">Bowler</th>
                                        <th class="py-2 px-3 text-right">O</th>
                                        <th class="py-2 px-3 text-right">M</th>
                                        <th class="py-2 px-3 text-right">R</th>
                                        <th class="py-2 px-3 text-right">W</th>
                                        <th class="py-2 px-3 text-right">Econ</th>
                                    </tr>
                                </thead>
                                <tbody id="bowling-stats">
                                    <!-- Bowling stats will go here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Match Summary Section (Hidden until match ends) -->
        <section id="match-summary" class="hidden bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Match Summary</h2>
            <div class="bg-gray-100 p-4 rounded-lg mb-6">
                <h3 class="text-xl font-bold mb-2" id="summary-title">Match Result</h3>
                <p class="text-lg font-medium" id="match-result">Team A won by X wickets</p>
                <p class="text-gray-600 mt-2" id="match-date">Date: </p>
                <p class="text-gray-600" id="match-venue">Venue: </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <!-- Team 1 Innings Summary -->
                <div class="bg-gray-100 p-4 rounded-lg">
                    <h3 class="text-lg font-bold mb-2" id="team1-innings-title">Team A - 1st Innings</h3>
                    <p class="text-xl font-semibold" id="team1-score">120/6 (10.0)</p>
                    <div class="mt-4">
                        <p class="font-medium">Top Performers</p>
                        <div class="bg-white rounded p-2 mt-1">
                            <p><span class="font-medium">Top Scorer:</span> <span id="team1-top-scorer">Player (runs)</span></p>
                            <p><span class="font-medium">Best Bowler:</span> <span id="team2-best-bowler">Player (figures)</span></p>
                        </div>
                    </div>
                </div>

                <!-- Team 2 Innings Summary -->
                <div class="bg-gray-100 p-4 rounded-lg">
                    <h3 class="text-lg font-bold mb-2" id="team2-innings-title">Team B - 2nd Innings</h3>
                    <p class="text-xl font-semibold" id="team2-score">121/4 (9.2)</p>
                    <div class="mt-4">
                        <p class="font-medium">Top Performers</p>
                        <div class="bg-white rounded p-2 mt-1">
                            <p><span class="font-medium">Top Scorer:</span> <span id="team2-top-scorer">Player (runs)</span></p>
                            <p><span class="font-medium">Best Bowler:</span> <span id="team1-best-bowler">Player (figures)</span></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2">
                    <h3 class="text-lg font-bold mb-3">Match Statistics</h3>
                    <div class="bg-gray-100 p-4 rounded-lg">
                        <canvas id="match-stats-chart" height="200"></canvas>
                    </div>
                </div>
                <div>
                    <h3 class="text-lg font-bold mb-3">Player of the Match</h3>
                    <div class="bg-gray-100 p-4 rounded-lg text-center">
                        <div class="inline-block bg-yellow-100 rounded-full p-3">
                            <i class="fas fa-trophy text-yellow-500 text-3xl"></i>
                        </div>
                        <p class="text-xl font-bold mt-3" id="player-of-match">Player Name</p>
                        <p class="text-gray-600" id="player-of-match-stats">Batting: 50(30) | Bowling: 2/15</p>
                    </div>
                </div>
            </div>

            <div class="mt-6 flex space-x-3">
                <button id="view-scorecard-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md transition">View Full Scorecard</button>
                <button id="new-match-btn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md transition">Start New Match</button>
            </div>
        </section>

        <!-- Wicket Modal -->
        <div id="wicket-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
            <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md">
                <h3 class="text-xl font-bold mb-4">Wicket!</h3>
                <form id="wicket-form" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 mb-2" for="dismissal-type">Type of Dismissal</label>
                        <select id="dismissal-type" class="w-full border border-gray-300 rounded-md px-3 py-2">
                            <option value="bowled">Bowled</option>
                            <option value="caught">Caught</option>
                            <option value="lbw">LBW</option>
                            <option value="stumped">Stumped</option>
                            <option value="run-out">Run Out</option>
                            <option value="hit-wicket">Hit Wicket</option>
                        </select>
                    </div>
                    <div id="fielder-container" class="hidden">
                        <label class="block text-gray-700 mb-2" for="fielder">Fielder</label>
                        <select id="fielder" class="w-full border border-gray-300 rounded-md px-3 py-2">
                            <!-- Fielders will be added here -->
                        </select>
                    </div>
                    <div id="run-out-batsman-container" class="hidden">
                        <label class="block text-gray-700 mb-2" for="run-out-batsman">Which Batsman</label>
                        <select id="run-out-batsman" class="w-full border border-gray-300 rounded-md px-3 py-2">
                            <option value="striker">Striker</option>
                            <option value="non-striker">Non-striker</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2" for="new-batsman">New Batsman</label>
                        <select id="new-batsman" class="w-full border border-gray-300 rounded-md px-3 py-2">
                            <!-- Available batsmen will be added here -->
                        </select>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" id="cancel-wicket" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-md transition">Cancel</button>
                        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md transition">Confirm Wicket</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Change Bowler Modal -->
        <div id="bowler-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
            <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md">
                <h3 class="text-xl font-bold mb-4">New Over - Select Bowler</h3>
                <form id="bowler-form" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 mb-2" for="new-bowler">Bowler</label>
                        <select id="new-bowler" class="w-full border border-gray-300 rounded-md px-3 py-2">
                            <!-- Available bowlers will be added here -->
                        </select>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md transition">Start Over</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-white py-6">
        <div class="container mx-auto px-4">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div>
                    <h3 class="text-xl font-bold mb-3">StreetCrick</h3>
                    <p class="text-gray-400">The ultimate cricket scoring app for gully cricket enthusiasts.</p>
                </div>
                <div>
                    <h4 class="font-bold mb-3">Quick Links</h4>
                    <ul class="space-y-2">
                        <li><a href="index.html" class="text-gray-400 hover:text-white">Home</a></li>
                        <li><a href="score-tracker.html" class="text-gray-400 hover:text-white">Score Tracker</a></li>
                        <li><a href="stats.html" class="text-gray-400 hover:text-white">Stats</a></li>
                        <li><a href="blog.html" class="text-gray-400 hover:text-white">Blog</a></li>
                    </ul>
                </div>
                <div>
                    <h4 class="font-bold mb-3">Resources</h4>
                    <ul class="space-y-2">
                        <li><a href="about.html" class="text-gray-400 hover:text-white">About Us</a></li>
                        <li><a href="privacy.html" class="text-gray-400 hover:text-white">Privacy Policy</a></li>
                        <li><a href="#" class="text-gray-400 hover:text-white">Terms of Use</a></li>
                        <li><a href="#" class="text-gray-400 hover:text-white">Contact</a></li>
                    </ul>
                </div>
                <div>
                    <h4 class="font-bold mb-3">Connect With Us</h4>
                    <div class="flex space-x-3">
                        <a href="#" class="text-gray-400 hover:text-white text-xl"><i class="fab fa-twitter"></i></a>
                        <a href="#" class="text-gray-400 hover:text-white text-xl"><i class="fab fa-facebook"></i></a>
                        <a href="#" class="text-gray-400 hover:text-white text-xl"><i class="fab fa-instagram"></i></a>
                        <a href="#" class="text-gray-400 hover:text-white text-xl"><i class="fab fa-github"></i></a>
                    </div>
                </div>
            </div>
            <div class="mt-6 pt-4 border-t border-gray-700 text-center text-gray-400
